    LivestockDetail:
      type: object
      description: |
        Detalle de un lote. Se listan los campos principales; la respuesta incluye campos
        adicionales según la categoría, el remate y la configuración del lote.
      properties:
        id:
          type: integer
          description: ID del lote (`o_id`)
        nro_lote:
          type: string
          description: Número de lote según formato del remate
        nro_ref:
          type: string
          nullable: true
          description: Número de referencia / certificación
        empresa_id:
          type: integer
        empresa:
          type: string
        link_web:
          type: string
          description: URL pública del lote
        titulo:
          type: string
        subtitulo:
          type: string
          nullable: true
        categoria_id:
          type: integer
        categoria:
          type: string
        cantidad:
          type: integer
        cantidad_machos:
          type: integer
          nullable: true
        cantidad_hembras:
          type: integer
          nullable: true
        peso:
          type: number
          nullable: true
        peso_min:
          type: number
          nullable: true
        peso_max:
          type: number
          nullable: true
        precio:
          type: string
          nullable: true
        moneda:
          type: string
        tipo_precio_kg:
          type: integer
          nullable: true
          description: "0 = por bulto, 1 = por kg"
        dpto:
          type: string
          description: Nombre del departamento
        dpto_id:
          type: integer
        localidad_texto:
          type: string
        raza_texto:
          type: string
          nullable: true
        observaciones:
          type: string
          nullable: true
        video:
          type: string
          nullable: true
          description: URL del video del lote
        video_status:
          type: string
          nullable: true
          enum: [processing, done, failed, null]
          description: |
            Estado del procesamiento del último video subido mediante `/v2/ofertas/{o_id}/upload/video`:
            `processing` = en proceso, `done` = disponible, `failed` = falló el procesamiento.
            `null` si nunca se subió un video por esa vía.
        r_id:
          type: integer
          nullable: true
          description: ID del remate al que pertenece el lote
        status_code:
          type: integer
          description: Código de estado del lote (`4` = dado de baja)
        status_text:
          type: string
        vendido:
          type: integer
          description: "1 si está vendido, 0 en caso contrario"
        baja:
          type: integer
          description: "1 si está dado de baja, 0 en caso contrario"
        privado:
          type: integer
          description: "1 si es privado, 0 si es público"

    LivestockVideoUploadRequest:
      type: object
      required:
        - files[]
      properties:
        files[]:
          type: array
          description: |
            Archivos de video (`video/*`), de 1 a 5, de hasta 150 MB cada uno.
            Se envía un campo `files[]` por archivo.
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: binary
        generar_thumb_from_video:
          type: boolean
          default: true
          description: Genera la imagen de portada del lote a partir del video.
        generar_hls:
          type: boolean
          default: false
          description: Genera además una versión HLS (streaming adaptativo) del video.

    LivestockVideoUploadAccepted:
      type: object
      properties:
        message:
          type: string
          example: "1 video recibido. El procesamiento puede demorar aprox. 2 minutos."

    ApiError:
      type: object
      properties:
        status:
          type: integer
          description: Código HTTP
          example: 400
        message:
          type: string
          example: "Solicitud inválida."
        errors:
          type: array
          description: Detalle de errores de validación (vacío si no aplica)
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    AuctionCreateRequest:
      type: object
      required:
        - nombre_remate
        - fecha_inicio
        - hora
      properties:
        nombre_remate:
          type: string
          description: Nombre del remate
          example: "Remate de Primavera"
        fecha_inicio:
          type: string
          format: date
          description: Fecha de inicio (`YYYY-MM-DD`)
          example: "2026-11-20"
        fecha_fin:
          type: string
          format: date
          description: Fecha de fin (`YYYY-MM-DD`). No puede ser anterior a `fecha_inicio`.
          example: "2026-11-21"
        hora:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Hora de inicio (`HH:MM`, 24 horas)
          example: "14:00"
        administra:
          type: string
          description: Quién administra el remate
        organiza:
          type: string
          description: Quién organiza el remate

    AuctionCreateSuccess:
      type: object
      properties:
        status:
          type: integer
          example: 1
        text:
          type: string
          example: "Remate creado."
        remate:
          type: object
          description: Datos del remate creado. Los campos opcionales no enviados vuelven en `null`.
          properties:
            remate_id:
              type: integer
              description: ID del remate creado (`r_id`)
              example: 9722
            nombre_remate:
              type: string
            fecha_inicio:
              type: string
              format: date
            fecha_fin:
              type: string
              format: date
              nullable: true
            hora:
              type: string
            administra:
              type: string
              nullable: true
            organiza:
              type: string
              nullable: true

